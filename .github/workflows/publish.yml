name: Publish npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  native:
    uses: ./.github/workflows/native.yml
  qualify:
    needs: native
    env:
      BASSFISH_RELEASE_BUILD: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: npm
      - run: node scripts/verify-release-tag.mjs
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native/turso/artifacts
          merge-multiple: true
      - run: npm run build:release
      - run: npm run ci
      - run: npm install -g @openai/codex@0.154.0
      - run: npm run test:codex-queue
      - run: npm run test:memory
      - run: npm run package:check
      - run: npm run test:memory-soak

  storage-soak:
    needs: native
    env:
      BASSFISH_RELEASE_BUILD: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: npm
      - run: node scripts/verify-release-tag.mjs
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native/turso/artifacts
          merge-multiple: true
      - run: npm run build:release
      - run: npm run test:soak

  bun:
    needs: native
    env:
      BASSFISH_RELEASE_BUILD: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        # 1.3.14 is the runtime OpenCode 1.18.29 embeds; latest guards the other direction.
        bun-version: [1.3.14, latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}
      - run: node scripts/verify-release-tag.mjs
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native/turso/artifacts
          merge-multiple: true
      - run: npm run build:release
      - run: npm run test:bun

  publish:
    needs: [qualify, storage-soak, bun]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: node scripts/verify-release-tag.mjs
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native/turso/artifacts
          merge-multiple: true
      - run: npm publish --access public
