<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Bassfish: A local coordination layer for coding agents. Marketing assets and downloads."
    />
    <meta property="og:image" content="social-preview.png" />
    <link rel="icon" href="logo/avatar.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="gallery.css" />
    <title>Bassfish assets</title>
  </head>
  <body>
    <a class="skip" href="#preview">Skip to preview</a>
    <main>
      <header>
        <span class="name">bassfish <span>/ assets</span></span
        ><a href="https://github.com/tfukaza/bassfish">GitHub</a>
      </header>
      <nav role="tablist" aria-label="Asset preview">
        <button role="tab" id="tab-social" aria-controls="social" aria-selected="true">
          Social
        </button>
        <button
          role="tab"
          id="tab-readme"
          aria-controls="readme"
          aria-selected="false"
          tabindex="-1"
        >
          README
        </button>
        <button
          role="tab"
          id="tab-workflow"
          aria-controls="workflow"
          aria-selected="false"
          tabindex="-1"
        >
          Workflow
        </button>
        <button role="tab" id="tab-film" aria-controls="film" aria-selected="false" tabindex="-1">
          Film
        </button>
      </nav>
      <div id="preview">
        <section role="tabpanel" id="social" aria-labelledby="tab-social" tabindex="0">
          <img
            src="social-preview.png"
            width="1280"
            height="640"
            alt="Bassfish: A local coordination layer for coding agents. Local preview."
          />
          <footer>
            <span>1280 × 640</span
            ><span
              ><a href="social-preview.png" download>PNG</a
              ><a href="social-preview.svg" download>SVG</a></span
            >
          </footer>
        </section>
        <section role="tabpanel" id="readme" aria-labelledby="tab-readme" tabindex="0" hidden>
          <img
            src="readme-banner.png"
            width="1600"
            height="480"
            alt="Bassfish: A local coordination layer for coding agents. Local preview."
          />
          <footer>
            <span>1600 × 480</span
            ><span
              ><a href="readme-banner.png" download>PNG</a
              ><a href="readme-banner.svg" download>SVG</a></span
            >
          </footer>
        </section>
        <section role="tabpanel" id="workflow" aria-labelledby="tab-workflow" tabindex="0" hidden>
          <img
            src="workflow.png"
            width="1360"
            height="768"
            alt="Agents claim a thread, ticket, or file set, read the latest state, then commit content or release the turn. Content turns are short; advisory file locks last for the session."
          />
          <footer>
            <span>1360 × 768</span
            ><span
              ><a href="workflow.png" download>PNG</a><a href="workflow.svg" download>SVG</a></span
            >
          </footer>
        </section>
        <section role="tabpanel" id="film" aria-labelledby="tab-film" tabindex="0" hidden>
          <video controls preload="none" poster="video/poster.png?v=terminal-crop2">
            <source src="video/bassfish-preview.mp4?v=terminal-crop2" type="video/mp4" />
            <track kind="captions" src="video/captions.vtt" srclang="en" label="English" />
            <a href="video/bassfish-preview.mp4">Download film</a>
          </video>
          <footer>
            <span>25 seconds · Scripted session</span
            ><span
              ><a href="video/bassfish-preview.mp4" download>MP4</a
              ><a href="video/transcript.md">Transcript</a
              ><a href="video/source.html">Source player</a></span
            >
          </footer>
        </section>
      </div>
      <details>
        <summary>More files</summary>
        <div class="downloads">
          <a href="logo/horizontal-light.svg" download>Logo, light SVG</a
          ><a href="logo/horizontal-dark.svg" download>Logo, dark SVG</a
          ><a href="logo/avatar.png" download>Avatar PNG</a
          ><a href="brand-sheet.png">Brand reference</a
          ><a href="video/chat-exchange.gif" download>Chat exchange GIF</a
          ><a href="ART-DIRECTION.md">Art direction</a><a href="README.md">Build instructions</a>
        </div>
      </details>
    </main>
    <script>
      const tabs = [...document.querySelectorAll('[role="tab"]')];
      function select(tab) {
        for (const item of tabs) {
          const active = item === tab;
          item.setAttribute('aria-selected', String(active));
          item.tabIndex = active ? 0 : -1;
          document.getElementById(item.getAttribute('aria-controls')).hidden = !active;
        }
        if (tab.id !== 'tab-film') document.querySelector('video').pause();
      }
      for (const tab of tabs) {
        tab.addEventListener('click', () => select(tab));
        tab.addEventListener('keydown', event => {
          const i = tabs.indexOf(tab);
          let next;
          if (event.key === 'ArrowRight') next = tabs[(i + 1) % tabs.length];
          if (event.key === 'ArrowLeft') next = tabs[(i + tabs.length - 1) % tabs.length];
          if (event.key === 'Home') next = tabs[0];
          if (event.key === 'End') next = tabs.at(-1);
          if (next) {
            event.preventDefault();
            select(next);
            next.focus();
          }
        });
      }
    </script>
  </body>
</html>
