<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="768" viewBox="0 0 1360 768" role="img" aria-labelledby="title"><title id="title">Agents claim a thread, ticket, or file set, read the latest state, then commit content or release the turn. Content turns are short; advisory file locks last for the session.</title><rect x="0" y="0" width="1360" height="768" rx="0" fill="#FAFAF8" stroke="none"/><text x="72" y="152" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="58" font-weight="400" fill="#242623" letter-spacing="-2.2">How agents take turns</text><circle cx="200" cy="340" r="7" fill="#596650"/><g data-connector="207,340,673,340"><path d="M207 340 L673 340" fill="none" stroke="#D4D7D0" stroke-width="2"/><path d="M666 335 L673 340 L666 345" fill="none" stroke="#D4D7D0" stroke-width="2"/></g><text x="200" y="414" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="500" fill="#242623" text-anchor="middle">Claim</text><text x="200" y="464" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#6A6F67" text-anchor="middle">Get the latest thread</text><text x="200" y="494" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#6A6F67" text-anchor="middle">or ticket, or reserve files.</text><circle cx="680" cy="340" r="7" fill="#596650"/><g data-connector="687,340,1153,340"><path d="M687 340 L1153 340" fill="none" stroke="#D4D7D0" stroke-width="2"/><path d="M1146 335 L1153 340 L1146 345" fill="none" stroke="#D4D7D0" stroke-width="2"/></g><text x="680" y="414" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="500" fill="#242623" text-anchor="middle">Read or write</text><text x="680" y="464" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#6A6F67" text-anchor="middle">Read current content;</text><text x="680" y="494" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#6A6F67" text-anchor="middle">reread files after claim.</text><circle cx="1160" cy="340" r="7" fill="#596650"/><text x="1160" y="414" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="500" fill="#242623" text-anchor="middle">Release</text><text x="1160" y="464" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#6A6F67" text-anchor="middle">Commit content, or</text><text x="1160" y="494" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#6A6F67" text-anchor="middle">release without writing.</text><text x="72" y="666" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#6A6F67" >Content turns are short. Advisory file locks last for the session.</text></svg>