name: Build patched Turso

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
          - os: ubuntu-24.04-arm
            platform: linux-arm64-gnu
          - os: ubuntu-24.04
            platform: linux-x64-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tmp/native-build/target
          key: turso-${{ matrix.platform }}-${{ hashFiles('native/turso/source.json', 'native/turso/statement-registry.patch') }}
      - run: node scripts/native-build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: native/turso/artifacts/*
          if-no-files-found: error
